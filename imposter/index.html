<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12101b">
  <title>Imposter Party Game</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root { color-scheme:dark; --ink:#f5f2ff; --muted:#aaa3bc; --surface:#1d1929; --surface-soft:#282235; --page:#12101b; --brand:#a78bfa; --brand-dark:#8b6df1; --line:#393149; --danger:#fb7185; }
    body.game-page { background:radial-gradient(circle at 8% 0, #2e2056 0, transparent 32rem), radial-gradient(circle at 95% 100%, #19374a 0, transparent 30rem), var(--page); color:var(--ink); padding:20px; min-height:100vh; }
    .game-shell { width:min(100%, 690px); margin:0 auto; padding:18px 0 45px; }
    .game-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .back-link { color:var(--muted); text-decoration:none; font-size:.94rem; }
    .brand { color:var(--brand); font-weight:800; letter-spacing:.04em; font-size:.85rem; text-transform:uppercase; }
    .game-card { background:linear-gradient(145deg, rgba(38,33,53,.96), rgba(25,22,35,.96)); border:1px solid var(--line); border-radius:24px; padding:clamp(22px, 5vw, 40px); box-shadow:0 18px 45px rgba(0,0,0,.34); animation:rise .35s ease both; }
    h1 { font-size:clamp(2rem, 7vw, 3.1rem); line-height:1.05; letter-spacing:-.045em; margin:0 0 10px; }
    h2 { font-size:1.15rem; margin:28px 0 12px; } .lead { color:var(--muted); margin:0; }
    .field-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; } label { display:block; font-weight:700; font-size:.9rem; } select, input[type="text"], input[type="number"] { width:100%; margin-top:7px; border:1px solid var(--line); border-radius:12px; background:var(--surface-soft); color:var(--ink); padding:12px; font:inherit; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 12px; } .section-title h2 { margin:0; }.names { display:grid; gap:8px; max-height:280px; overflow:auto; padding-right:4px; } .name-row { display:flex; align-items:center; gap:9px; } .name-row span { color:var(--muted); width:24px; text-align:right; font-size:.84rem; }.add-player{white-space:nowrap;padding:8px 12px;min-height:38px;font-size:.88rem}
    .toggle { display:flex; align-items:center; gap:10px; margin:22px 0; cursor:pointer; } .toggle input { accent-color:var(--brand); width:19px; height:19px; }
    .button { border:0; border-radius:13px; padding:13px 18px; font:700 1rem inherit; cursor:pointer; transition:transform .16s, background .16s, box-shadow .16s; min-height:48px; }
    .button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #c4b5fd; outline-offset:2px; } .button:hover { transform:translateY(-1px); } .primary { width:100%; background:var(--brand); color:#171225; box-shadow:0 8px 16px rgba(167,139,250,.22); } .primary:hover { background:#c4b5fd; } .secondary { background:#302942; color:#d8cdff; } .danger { background:#4b2033; color:#fda4af; }
    .notice { background:#31294a; color:#d9ceff; padding:12px 14px; border-radius:12px; margin-top:16px; font-size:.92rem; } .hidden { display:none !important; }
    .progress { height:8px; border-radius:99px; overflow:hidden; background:#393149; margin:20px 0 8px; }.progress span{display:block;height:100%;background:var(--brand);transition:width .35s ease}.status{color:var(--muted);font-size:.9rem;margin:0 0 22px}
    .center { text-align:center; } .eyebrow{color:var(--brand);font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}.big-name{font-size:clamp(2rem,8vw,3.6rem);margin:3px 0 28px;overflow-wrap:anywhere}.card-answer{border:2px dashed #67598a;background:#29233a;border-radius:20px;padding:30px 18px;margin:23px 0;animation:rise .3s ease}.answer-word{font-size:clamp(2.1rem,10vw,4.4rem);font-weight:900;letter-spacing:-.06em;color:var(--brand);overflow-wrap:anywhere}.imposter-word{color:var(--danger);letter-spacing:.04em}.hint{margin:14px 0 0;color:var(--muted);font-weight:700}.player-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:25px 0}.player-status div{background:#282235;border:1px solid #393149;border-radius:11px;padding:10px 12px;font-size:.9rem}.waiting{color:var(--muted)}.viewed{color:#5eeaa0}.results{display:grid;gap:12px;margin:26px 0}.result-box{background:#282235;border:1px solid #393149;border-radius:15px;padding:17px}.result-box p{margin:0 0 4px;color:var(--muted);font-size:.85rem}.result-box strong{font-size:1.35rem}.button-row{display:flex;gap:10px;flex-wrap:wrap}.button-row .button{flex:1}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}} @media(max-width:480px){body.game-page{padding:14px}.game-shell{padding-top:8px}.field-grid{grid-template-columns:1fr}.game-card{border-radius:20px;padding:22px 18px}.game-top{margin-bottom:18px}.names{max-height:240px}.name-row input{min-width:0}.button{min-height:50px}}
  </style>
</head>
<body class="game-page">
  <main class="game-shell">
    <div class="game-top"><a class="back-link" href="../index.html">← All projects</a><span class="brand">Pass & Play</span></div>
    <section class="game-card" id="app" aria-live="polite"></section>
  </main>
  <script src="game.js"></script>
</body>
</html>
